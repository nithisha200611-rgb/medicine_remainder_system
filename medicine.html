<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medicine Reminder System</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef5f9;
            min-height: 100vh;
        }

        header {
            background: #1976d2;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
            margin-bottom: 25px;
        }

        .card h2 {
            color: #1976d2;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            border: none;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: white;
        }

        .add-btn {
            background: #1976d2;
            width: 100%;
            margin-top: 5px;
            font-size: 16px;
        }

        .add-btn:hover {
            background: #125ca5;
        }

        .medicine-list {
            display: grid;
            gap: 15px;
        }

        .medicine {
            border-left: 5px solid #1976d2;
            background: #f8fbfd;
            padding: 18px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .medicine-info h3 {
            color: #1976d2;
            margin-bottom: 8px;
        }

        .medicine-info p {
            margin: 4px 0;
            color: #555;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .taken-btn {
            background: #2e7d32;
        }

        .taken-btn:hover {
            background: #1b5e20;
        }

        .delete-btn {
            background: #d32f2f;
        }

        .delete-btn:hover {
            background: #a92323;
        }

        .taken {
            opacity: 0.65;
            border-left-color: #2e7d32;
        }

        .taken h3 {
            text-decoration: line-through;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        .status {
            margin-top: 10px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        @media (max-width: 650px) {
            .medicine {
                flex-direction: column;
                align-items: flex-start;
            }

            .actions {
                width: 100%;
            }

            .actions button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>💊 Medicine Reminder System</h1>
    <p>Never forget to take your medicine on time</p>
</header>

<div class="container">

    <!-- Add Medicine -->
    <div class="card">
        <h2>Add Medicine</h2>

        <form id="medicineForm">

            <div class="form-group">
                <label for="medicineName">Medicine Name</label>
                <input
                    type="text"
                    id="medicineName"
                    placeholder="Example: Paracetamol"
                    required
                >
            </div>

            <div class="form-group">
                <label for="dosage">Dosage</label>
                <input
                    type="text"
                    id="dosage"
                    placeholder="Example: 500 mg"
                    required
                >
            </div>

            <div class="form-group">
                <label for="medicineDate">Date</label>
                <input
                    type="date"
                    id="medicineDate"
                    required
                >
            </div>

            <div class="form-group">
                <label for="medicineTime">Reminder Time</label>
                <input
                    type="time"
                    id="medicineTime"
                    required
                >
            </div>

            <button type="submit" class="add-btn">
                + Add Medicine
            </button>

        </form>
    </div>


    <!-- Medication Schedule -->
    <div class="card">
        <h2>📋 Medication Schedule</h2>

        <div id="medicineList" class="medicine-list">
            <p class="empty">No medicines added yet.</p>
        </div>
    </div>

</div>

<footer>
    <p>Medicine Reminder System © 2026</p>
</footer>


<script>

    // Get medicines from localStorage
    let medicines = JSON.parse(localStorage.getItem("medicines")) || [];

    const form = document.getElementById("medicineForm");
    const medicineList = document.getElementById("medicineList");

    // Ask permission for browser notifications
    if ("Notification" in window) {
        Notification.requestPermission();
    }

    // Set today's date automatically
    const today = new Date().toISOString().split("T")[0];
    document.getElementById("medicineDate").value = today;


    // Add medicine
    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const name = document.getElementById("medicineName").value.trim();
        const dosage = document.getElementById("dosage").value.trim();
        const date = document.getElementById("medicineDate").value;
        const time = document.getElementById("medicineTime").value;

        if (name === "" || dosage === "" || date === "" || time === "") {
            alert("Please fill in all fields.");
            return;
        }

        const medicine = {
            id: Date.now(),
            name: name,
            dosage: dosage,
            date: date,
            time: time,
            taken: false,
            notified: false
        };

        medicines.push(medicine);

        saveMedicines();
        displayMedicines();

        form.reset();

        document.getElementById("medicineDate").value = today;

        alert("Medicine added successfully!");
    });


    // Save medicines
    function saveMedicines() {
        localStorage.setItem("medicines", JSON.stringify(medicines));
    }


    // Display medicines
    function displayMedicines() {

        medicineList.innerHTML = "";

        if (medicines.length === 0) {
            medicineList.innerHTML =
                '<p class="empty">No medicines added yet.</p>';
            return;
        }

        // Sort by date and time
        medicines.sort(function(a, b) {

            const dateA = new Date(a.date + "T" + a.time);
            const dateB = new Date(b.date + "T" + b.time);

            return dateA - dateB;
        });


        medicines.forEach(function(medicine) {

            const medicineDiv = document.createElement("div");

            medicineDiv.className =
                "medicine" + (medicine.taken ? " taken" : "");

            medicineDiv.innerHTML = `

                <div class="medicine-info">

                    <h3>💊 ${escapeHTML(medicine.name)}</h3>

                    <p>
                        <strong>Dosage:</strong>
                        ${escapeHTML(medicine.dosage)}
                    </p>

                    <p>
                        <strong>Date:</strong>
                        ${medicine.date}
                    </p>

                    <p>
                        <strong>Time:</strong>
                        ${medicine.time}
                    </p>

                    <p class="status">
                        <strong>Status:</strong>
                        ${medicine.taken ? "✅ Taken" : "⏳ Pending"}
                    </p>

                </div>

                <div class="actions">

                    <button
                        class="taken-btn"
                        onclick="markTaken(${medicine.id})">
                        ${medicine.taken ? "Undo" : "Mark Taken"}
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteMedicine(${medicine.id})">
                        Delete
                    </button>

                </div>
            `;

            medicineList.appendChild(medicineDiv);
        });
    }


    // Mark medicine as taken
    function markTaken(id) {

        const medicine = medicines.find(function(item) {
            return item.id === id;
        });

        if (!medicine) {
            return;
        }

        medicine.taken = !medicine.taken;

        saveMedicines();
        displayMedicines();
    }


    // Delete medicine
    function deleteMedicine(id) {

        const confirmation =
            confirm("Are you sure you want to delete this medicine?");

        if (!confirmation) {
            return;
        }

        medicines = medicines.filter(function(item) {
            return item.id !== id;
        });

        saveMedicines();
        displayMedicines();
    }


    // Check reminders every 30 seconds
    setInterval(checkReminders, 30000);

    checkReminders();


    function checkReminders() {

        const now = new Date();

        const currentDate =
            now.getFullYear() +
            "-" +
            String(now.getMonth() + 1).padStart(2, "0") +
            "-" +
            String(now.getDate()).padStart(2, "0");

        const currentTime =
            String(now.getHours()).padStart(2, "0") +
            ":" +
            String(now.getMinutes()).padStart(2, "0");


        medicines.forEach(function(medicine) {

            if (
                medicine.date === currentDate &&
                medicine.time === currentTime &&
                !medicine.taken &&
                !medicine.notified
            ) {

                showReminder(medicine);

                medicine.notified = true;

                saveMedicines();
            }

        });
    }


    // Show reminder
    function showReminder(medicine) {

        alert(
            "💊 MEDICINE REMINDER\n\n" +
            "Medicine: " + medicine.name + "\n" +
            "Dosage: " + medicine.dosage + "\n\n" +
            "It is time to take your medicine!"
        );


        // Browser notification
        if (
            "Notification" in window &&
            Notification.permission === "granted"
        ) {

            new Notification("💊 Medicine Reminder", {
                body:
                    medicine.name +
                    " - " +
                    medicine.dosage +
                    "\nIt is time to take your medicine!"
            });
        }
    }


    // Prevent HTML injection when displaying user input
    function escapeHTML(value) {

        return value
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

</script>

</body>
</html>
